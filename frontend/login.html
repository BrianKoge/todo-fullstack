<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - To-Do App</title>

    <link rel="stylesheet" href="./css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>My To-Do</h1>

            <p class="subtitle">
                Login to manage your tasks
            </p>


            <!-- IMPORTANT: auth.js expects loginMessage -->
            <div
                id="loginMessage"
                class="error-message"
                role="alert"
            ></div>


            <form
                id="loginForm"
                class="auth-form"
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="auth-switch">

                Don't have an account?

                <a href="./register.html">
                    Register
                </a>

            </div>

        </div>

    </div>


    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
