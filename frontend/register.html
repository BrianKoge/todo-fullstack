<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - To-Do App</title>

    <link rel="stylesheet" href="./css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>My To-Do</h1>

            <p class="subtitle">
                Create your account
            </p>


            <!-- IMPORTANT: auth.js expects registerMessage -->
            <div
                id="registerMessage"
                class="error-message"
            ></div>


            <form
                id="registerForm"
                class="auth-form"
            >

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <p class="password-hint">
                        Password must be at least 8 characters.
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit">
                    Register
                </button>

            </form>


            <div class="auth-switch">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
